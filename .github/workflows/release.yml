name: Release

# Triggered by any `v*` tag push.
on:
  push:
    tags: ['v*']
  # workflow_dispatch lets us manually re-trigger against an existing tag
  # (via `gh workflow run release.yml --ref <tag>`) when a prior run is
  # blocked on transient infra (GHCR outage, runner-pool backlog, GitHub
  # Actions brown-out, etc.). Re-dispatching does NOT re-tag; the tag is
  # immutable.
  workflow_dispatch: {}

# Default to least privilege; individual jobs escalate only what they need.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Shared: CI must pass on the tagged commit.
  # --------------------------------------------------------------------
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ====================================================================
  # Build pipeline
  # ====================================================================
  # Artifact producer is packaging/tarball/stage.sh — the same script
  # exercised by the tag-time rehearsal.
  # Filenames are `hopper-<version>-<rid>.(tar.gz|zip)` (ADR-016 stage 2; <version> is the tag without its 'v').
  # Every archive is checked by scripts/verify-archive.py BEFORE it is attested or uploaded, including that the
  # version in its name equals the tag (so a tag cut without bumping the csproj fails here, unpublished). The
  # package-manager manifests in packaging/ follow the published assets in a separate hash-sync change.
  # ====================================================================
  build-binaries:
    needs: ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ext: tar.gz
            run: true
          - rid: linux-musl-x64
            os: ubuntu-latest
            ext: tar.gz
            run: false
          - rid: osx-arm64
            os: macos-15
            ext: tar.gz
            run: true
          - rid: win-x64
            os: windows-latest
            ext: zip
            run: true
          # Missing platforms added per README / stage.sh RID contract (C1)
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
            run: true
          - rid: win-arm64
            # Cross-publish from win-x64 runner; MSVC ARM64 cross-toolchain
            # is available in the Visual Studio installation on windows-latest.
            os: windows-latest
            ext: zip
            run: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # NativeAOT on linux-musl-x64 from a glibc host needs the musl
      # cross-linker + zlib. ILC shells out to clang for the final link.
      - name: Install musl AOT toolchain (linux-musl-x64 only)
        if: matrix.rid == 'linux-musl-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Stage artifact (${{ matrix.rid }})
        shell: bash
        run: bash packaging/tarball/stage.sh ${{ matrix.rid }}

      - name: Resolve artifact path
        id: artifact
        shell: bash
        run: |
          # stage.sh hardcodes VERSION; we glob-match the produced filename
          # rather than re-parsing the tag, so the workflow stays correct
          # as long as exactly one artifact for this RID is produced.
          FILE="$(ls dist/hopper-*-${{ matrix.rid }}.${{ matrix.ext }})"
          BASENAME="$(basename "$FILE" .${{ matrix.ext }})"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Verify archive (name, layout, contents, and a real run where this runner can)
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          RUN_IT: ${{ matrix.run }}
          FILE: ${{ steps.artifact.outputs.file }}
        run: |
          PY="$(command -v python3 || command -v python)"
          ARGS=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then ARGS+=(--version "${GITHUB_REF_NAME#v}"); fi
          if [[ "$RUN_IT" == "true" ]]; then ARGS+=(--run); fi
          "$PY" scripts/verify-archive.py "$FILE" "$RID" "${ARGS[@]}"

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          dotnet tool restore
          dotnet dotnet-CycloneDX azureopenai-cli/AzureOpenAI_CLI.csproj \
            --output dist \
            --filename ${{ steps.artifact.outputs.basename }}.sbom.json \
            --output-format Json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.artifact.outputs.file }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.basename }}
          path: |
            ${{ steps.artifact.outputs.file }}
            dist/${{ steps.artifact.outputs.basename }}.sbom.json

  docker-publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build-binaries, docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: hopper-*
          merge-multiple: true

      - name: Compute digests
        run: |
          cd artifacts
          sha256sum hopper-*.tar.gz hopper-*.zip 2>/dev/null | sort | tee ../digests.txt

      # The body is built by scripts/release-body.sh (testable, and every file name in it is held to the release
      # matrix). Its notes are the CHANGELOG section for exactly this version, so cut the release (rename
      # [Unreleased] to [X.Y.Z]) before tagging; with no such section the script fails and nothing is published.
      - name: Build release body
        env:
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: bash scripts/release-body.sh "$REF" "$REPO" "$OWNER" digests.txt > release-body.md

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          body_path: release-body.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sbom.json
            digests.txt
