name: Packaging rehearsal

# Builds and verifies every release archive WITHOUT publishing anything: the same stage.sh, the same six runtime
# identifiers and the same scripts/verify-archive.py check the release job runs, so a packaging mistake (a wrong
# archive name, a missing alias, a broken Windows zip, a binary that does not start) fails on the pull request
# instead of on a public tag. It runs only when something that shapes the archives changes.
#
# Keep the matrix identical to release.yml's build-binaries matrix (a test in tests/integration_tests.sh enforces it).
on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/packaging-rehearsal.yml'
      - 'scripts/verify-archive.py'
      - 'scripts/release-body.sh'
      - 'scripts/release-notes.sh'
      - 'azureopenai-cli/AzureOpenAI_CLI.csproj'
  # Run it by hand before cutting a release:  gh workflow run packaging-rehearsal.yml --ref <branch>
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: packaging-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ext: tar.gz
            run: true
          - rid: linux-musl-x64
            os: ubuntu-latest
            ext: tar.gz
            run: false
          - rid: osx-arm64
            os: macos-14
            ext: tar.gz
            run: true
          - rid: win-x64
            os: windows-latest
            ext: zip
            run: true
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
            run: true
          - rid: win-arm64
            os: windows-latest
            ext: zip
            run: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install musl AOT toolchain (linux-musl-x64 only)
        if: matrix.rid == 'linux-musl-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Stage artifact (${{ matrix.rid }})
        shell: bash
        run: bash packaging/tarball/stage.sh ${{ matrix.rid }}

      - name: Verify archive (name, layout, contents, and a real run where this runner can)
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          EXT: ${{ matrix.ext }}
          RUN_IT: ${{ matrix.run }}
        run: |
          PY="$(command -v python3 || command -v python)"
          FILE="$(ls dist/hopper-*-"$RID"."$EXT")"
          ARGS=()
          if [[ "$RUN_IT" == "true" ]]; then ARGS+=(--run); fi
          "$PY" scripts/verify-archive.py "$FILE" "$RID" "${ARGS[@]}"
