name: eval-gate

# Live eval gate: runs the built-in corpora against a PINNED model and fails on a regression against
# the recorded baseline. It needs credentials, which repository secrets provide; fork pull requests
# and repositories without them get a visible SKIPPED notice instead of a silent green.
#
# Set the repository variable EVAL_GATE_REQUIRED=true to make a skipped gate FAIL. Green must never
# mean "nothing was checked". Pin the model with the repository variable EVAL_GATE_MODEL.
#
# Policy (thresholds, repeat count): .github/eval-gate.json. Baselines: eval/baselines/.
# Record a baseline: run the "baseline" mode of scripts/eval-gate.sh with credentials and commit it.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly, Monday 05:17 UTC
  pull_request:
    branches: [main]
    paths:
      - 'azureopenai-cli/Eval/**'
      - 'azureopenai-cli/Squad/SquadInitializer.cs'
      - 'azureopenai-cli/Program.cs'
      - '.github/eval-gate.json'
      - '.github/workflows/eval-gate.yml'
      - 'scripts/eval-gate.sh'
      - 'eval/baselines/**'

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build CLI
        run: dotnet build azureopenai-cli/AzureOpenAI_CLI.csproj --configuration Release

      - name: Run the eval gate
        env:
          BIN: ./azureopenai-cli/bin/Release/net10.0/az-ai
          EVAL_GATE_MODEL: ${{ vars.EVAL_GATE_MODEL }}
          EVAL_GATE_REQUIRED: ${{ vars.EVAL_GATE_REQUIRED }}
          AZUREOPENAIENDPOINT: ${{ secrets.AZUREOPENAIENDPOINT }}
          AZUREOPENAIAPI: ${{ secrets.AZUREOPENAIAPI }}
        run: bash scripts/eval-gate.sh run

      - name: Upload per-corpus reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-gate-reports
          path: eval-gate-out/
          if-no-files-found: ignore
          retention-days: 30
